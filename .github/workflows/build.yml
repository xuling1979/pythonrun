name: Build Windows Executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller main.spec --clean

      - name: Display build output
        run: |
          Get-ChildItem dist/main/
          Get-ChildItem dist/main/*.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/main/

  test:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: .\dist\

      - name: Verify executable exists
        run: |
          if (Test-Path "dist\main.exe") {
            Write-Host "main.exe found"
            $file = Get-Item "dist\main.exe"
            Write-Host "Size: $($file.Length) bytes"
          } else {
            Write-Host "ERROR: main.exe not found"
            Write-Host "Checking actual structure:"
            Get-ChildItem -Recurse dist\
            exit 1
          }

      - name: Try to run the executable
        run: |
          try {
            $proc = Start-Process -FilePath "dist\main.exe" -PassThru -WindowStyle Hidden -ErrorAction Stop
            Start-Sleep -Seconds 3
            if (!$proc.HasExited) {
              Write-Host "Application started successfully (PID: $($proc.Id))"
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "Application terminated for testing"
            } else {
              Write-Host "Application exited with code: $($proc.ExitCode)"
            }
          } catch {
            Write-Host "Note: GUI application cannot fully run in headless environment"
            Write-Host "This is expected - GUI apps need a display"
          }
        shell: pwsh
